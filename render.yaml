services:
  - type: web
    name: family-album
    runtime: docker
    plan: free
    dockerfilePath: ./family-album/Dockerfile
    dockerContext: ./family-album
    healthCheckPath: /login
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SHARE_EXPIRATION
        value: PT24H
