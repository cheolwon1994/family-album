<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>초대 가입 · 우리 앨범</title><link rel="stylesheet" th:href="@{/styles.css}">
</head>
<body class="auth-page">
<main class="auth-card">
    <a class="back-link" th:href="@{/login}">← 로그인으로</a>
    <p class="eyebrow">INVITE ONLY</p>
    <h1>함께 앨범을 만들어요</h1>
    <p class="muted">관리자에게 받은 일회용 초대 코드로 가입해 주세요.</p>
    <div class="notice error" th:if="${signupError}" th:text="${signupError}"></div>
    <form th:action="@{/signup}" method="post" class="form-stack">
        <label>이메일<input type="email" name="email" th:value="${email}" autocomplete="email" required></label>
        <label>비밀번호<input type="password" name="password" minlength="10" autocomplete="new-password" required><small>10자 이상</small></label>
        <label>초대 코드<input type="text" name="inviteCode" autocomplete="off" required></label>
        <button class="button primary" type="submit">계정 만들기</button>
    </form>
</main>
</body>
</html>
