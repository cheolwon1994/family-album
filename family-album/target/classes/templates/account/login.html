<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>로그인 · 우리 앨범</title><link rel="stylesheet" th:href="@{/styles.css}">
</head>
<body class="auth-page">
<main class="auth-card">
    <div class="brand-mark">우리</div>
    <p class="eyebrow">PRIVATE FAMILY ALBUM</p>
    <h1>우리의 작은 순간들</h1>
    <p class="muted">초대받은 사람들과 사진과 영상을 함께 모아보세요.</p>
    <div class="notice success" th:if="${success}" th:text="${success}"></div>
    <div class="notice error" th:if="${param.error}">이메일 또는 비밀번호를 확인해 주세요.</div>
    <div class="notice" th:if="${param.logout}">로그아웃했어요.</div>
    <form th:action="@{/login}" method="post" class="form-stack">
        <label>이메일<input type="email" name="email" autocomplete="username" required autofocus></label>
        <label>비밀번호<input type="password" name="password" autocomplete="current-password" required></label>
        <button class="button primary" type="submit">로그인</button>
    </form>
    <p class="auth-foot">초대 코드가 있나요? <a th:href="@{/signup}">계정 만들기</a></p>
</main>
</body>
</html>
