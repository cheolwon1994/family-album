spring:
  profiles:
    default: local
  application:
    name: spring-server
  datasource:
    url: jdbc:h2:file:${DB_PATH:./spring-server};DB_CLOSE_ON_EXIT=FALSE
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 100MB

server:
  port: ${PORT:8080}

app:
  bootstrap:
    admin-email: ${ADMIN_EMAIL:}
    admin-password: ${ADMIN_PASSWORD:}
    member-email: ${MEMBER_EMAIL:}
    member-password: ${MEMBER_PASSWORD:}
  storage:
    location: ${UPLOAD_DIR:./uploads}
  share:
    expiration: ${SHARE_EXPIRATION:PT24H}
